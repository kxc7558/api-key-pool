<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Key 代理池 · 操作台</title>
<style>
  :root{
    --bg:#f7f8fb; --card:#ffffff; --border:#e5e9f0; --border2:#eef1f6;
    --text:#0f172a; --muted:#64748b; --faint:#6b7280;
    --primary:#6366f1; --primary-hover:#4f46e5; --primary-bg:#eef2ff;
    --green:#10b981; --green-bg:#ecfdf5;
    --blue:#3b82f6; --blue-bg:#eff6ff;
    --orange:#f59e0b; --orange-bg:#fffbeb;
    --red:#ef4444; --red-bg:#fef2f2;
    --purple:#8b5cf6; --purple-bg:#f5f3ff;
    --sidebar-bg:#0f172a; --sidebar-muted:#7c8aa0; --sidebar-text:#cbd5e1;
    --radius:14px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
    --shadow-md:0 4px 8px -2px rgba(15,23,42,.08),0 2px 4px -2px rgba(15,23,42,.05);
    --shadow-lg:0 12px 24px -6px rgba(15,23,42,.16);
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;-webkit-font-smoothing:antialiased}
  a{color:var(--primary)}
  code,.mono{font-family:var(--mono)}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}

  /* 图标 */
  .ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  /* 侧边栏 */
  #sidebar{flex:0 0 232px;position:sticky;top:0;height:100vh;background:var(--sidebar-bg);display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
  .brand-logo{width:38px;height:38px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(99,102,241,.4)}
  .brand-logo .ic{width:20px;height:20px}
  .brand-name{font-size:15px;font-weight:600;color:#fff;line-height:1.25}
  .brand-name span{display:block;font-size:12px;font-weight:400;color:var(--sidebar-muted)}
  .menu{display:flex;flex-direction:column;gap:3px}
  .menu button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:10px 12px;border-radius:10px;font-size:13.5px;color:var(--sidebar-text);cursor:pointer;text-align:left;transition:.15s;white-space:nowrap;font-family:inherit}
  .menu button:hover{background:rgba(255,255,255,.06);color:#fff}
  .menu button.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.35)}
  .menu button .ic{width:19px;height:19px}
  .sidebar-foot{margin-top:auto;padding:14px 8px 4px;font-size:12px;color:var(--sidebar-muted);border-top:1px solid rgba(255,255,255,.08)}

  /* 布局 */
  .layout{flex:1;min-width:0;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 28px;height:62px}
  header .page-title{font-size:17px;font-weight:600}
  header .spacer{flex:1}
  header .addr{font-size:12px;color:var(--muted)}
  header .addr code{font-size:12px;background:var(--bg);padding:3px 8px;border-radius:6px}
  main{max-width:1120px;width:100%;margin:0 auto;padding:28px}

  /* 按钮 */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--text);padding:8px 15px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit}
  .btn:hover{border-color:#cbd5e1;background:#f8fafc}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(99,102,241,.4)}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:#f1f5f9;border-color:transparent}
  .btn.danger{color:var(--red)}
  .btn.danger:hover{border-color:#fecaca;background:var(--red-bg)}
  .btn.sm{padding:5px 11px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card h3::before{content:'';width:3px;height:15px;border-radius:2px;background:var(--primary);flex:none}
  .card h3 .tag{font-size:12px;color:var(--muted);font-weight:400}

  /* 统计卡 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px}
  .stat-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .stat-ic .ic{width:21px;height:21px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:24px;font-weight:600;letter-spacing:-.5px;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat .v.g{color:var(--green)} .stat .v.b{color:var(--blue)} .stat .v.o{color:var(--orange)} .stat .v.r{color:var(--red)} .stat .v.p{color:var(--purple)}

  /* 表格 */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border2)}
  th{background:transparent;font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#f8fafc}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .err{color:var(--faint);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num{font-variant-numeric:tabular-nums}

  /* 状态徽章 */
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.4}
  .badge .dot{width:6px;height:6px;border-radius:50%;margin:0}
  .badge-ok{background:var(--green-bg);color:#047857} .badge-ok .dot{background:var(--green)}
  .badge-warn{background:var(--orange-bg);color:#b45309} .badge-warn .dot{background:var(--orange)}
  .badge-err{background:var(--red-bg);color:#b91c1c} .badge-err .dot{background:var(--red)}
  .badge-muted{background:#f1f5f9;color:#475569} .badge-muted .dot{background:#6b7280}
  .badge-purple{background:var(--purple-bg);color:#6d28d9} .badge-purple .dot{background:var(--purple)}
  .badge-blue{background:var(--blue-bg);color:#1d4ed8} .badge-blue .dot{background:var(--blue)}

  /* 表单 */
  .f{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;background:#fff;color:var(--text);transition:.15s;font-family:inherit}
  .f:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
  .f.mono{font-family:var(--mono);font-size:12.5px}
  textarea.f{resize:vertical;line-height:1.5}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
  input[type="checkbox"],input[type="radio"]{accent-color:var(--primary);width:15px;height:15px;cursor:pointer}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .hint{font-size:12px;color:var(--faint)}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .empty{color:var(--faint);text-align:center;padding:40px 0}

  /* 平台卡片 */
  .pv-head{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .pv-head input{font-weight:600}
  .keys-label{margin-top:12px}
  .sub-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}

  /* 保存状态 */
  .dirty-dot{display:none;width:8px;height:8px;border-radius:50%;background:var(--orange);margin-right:6px}
  .dirty-dot.show{display:inline-block}

  /* toast */
  #toast{position:fixed;right:24px;bottom:24px;z-index:100;display:flex;flex-direction:column;gap:8px}
  .toast{background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);transition:.25s}
  .toast.show{opacity:1;transform:none}
  .toast.ok{background:#047857} .toast.err{background:#b91c1c}

  /* 密码弹窗 */
  #modal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
  #modal.show{display:flex}
  #modal .box{background:#fff;border-radius:16px;padding:28px;width:360px;max-width:100%;box-shadow:var(--shadow-lg)}
  #modal h3{margin:0 0 6px;font-size:17px;font-weight:600}
  #modal .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
  #modal .row{display:flex;gap:8px;margin-top:14px}

  /* 测试结果 */
  #pg-out{margin-top:14px}
  #pg-out .box{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:10px}
  #pg-out pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font-size:13px;line-height:1.6}
  .reasoning{color:var(--muted);border-left:3px solid var(--border);padding-left:10px;margin-top:10px;font-size:12.5px}
  .meta{font-size:12px;color:var(--faint);margin-top:8px}

  /* 首页 */
  .home-hero{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
  .home-hero-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
  .home-hero-icon .ic{width:28px;height:28px}
  .home-hero-title{font-size:19px;font-weight:600}
  .home-hero-sub{font-size:13px;color:var(--muted);margin-top:4px}
  .home-hero-stats{margin-left:auto;display:flex;gap:30px}
  .home-hero-stat{text-align:right}
  .home-hero-stat .k{font-size:12px;color:var(--muted)}
  .home-hero-stat .v{font-size:22px;font-weight:600;letter-spacing:-.5px}
  .home-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .home-tile{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px 20px;cursor:pointer;transition:.18s;box-shadow:var(--shadow-sm)}
  .home-tile:hover{border-color:var(--primary);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
  .home-tile-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-bg);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--primary)}
  .home-tile-icon .ic{width:22px;height:22px}
  .home-tile-title{font-size:15px;font-weight:600}
  .home-tile-desc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="brand-logo"><svg class="ic"><use href="#i-zap"/></svg></div>
    <div class="brand-name">API 代理池<span>管理台</span></div>
  </div>
  <nav id="nav" class="menu">
    <button data-tab="home" class="active"><svg class="ic"><use href="#i-home"/></svg>首页</button>
    <button data-tab="overview"><svg class="ic"><use href="#i-pulse"/></svg>运行状态</button>
    <button data-tab="providers"><svg class="ic"><use href="#i-key"/></svg>密钥管理</button>
    <button data-tab="models"><svg class="ic"><use href="#i-layers"/></svg>模型</button>
    <button data-tab="access"><svg class="ic"><use href="#i-link"/></svg>对接密钥</button>
    <button data-tab="collab-keys" style="display:none"><svg class="ic"><use href="#i-key"/></svg>放 Key 入池</button>
    <button data-tab="collab-access" style="display:none"><svg class="ic"><use href="#i-link"/></svg>生成用户Key</button>
    <button data-tab="collab-list" style="display:none"><svg class="ic"><use href="#i-list"/></svg>我创建的Key</button>
    <button data-tab="logs"><svg class="ic"><use href="#i-list"/></svg>使用记录</button>
    <button data-tab="usage"><svg class="ic"><use href="#i-chart"/></svg>用量统计</button>
    <button data-tab="settings"><svg class="ic"><use href="#i-gear"/></svg>设置</button>
    <button data-tab="playground"><svg class="ic"><use href="#i-zap"/></svg>试一下</button>
  </nav>
  <div class="sidebar-foot">仅本机访问 · 数据存本地</div>
</aside>

<div class="layout">
<header>
  <div class="page-title" id="page-title">首页</div>
  <div class="spacer"></div>
  <div class="addr">服务 <code id="hdr-addr">—</code></div>
  <button class="btn ghost" id="btn-reload" title="放弃本地未保存的修改，重新读取">重新加载</button>
  <button class="btn ghost" id="btn-lock" title="锁定操作台，需重新输入密码">锁定</button>
  <button class="btn primary" id="btn-save"><span class="dirty-dot" id="dirty-dot"></span>保存配置</button>
</header>
<main id="main"></main>
</div>


<div id="toast"></div>

<div id="modal">
  <div class="box">
    <h3>需要管理密码</h3>
    <div class="sub" id="modal-sub">操作台已设置管理密码，输入后即可管理配置。</div>
    <input class="f" type="password" id="modal-pwd" placeholder="adminToken" autocomplete="off">
    <div class="row">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn primary" id="modal-ok" style="flex:1">确认</button>
    </div>
    <div class="hint" id="modal-err" style="margin-top:10px;color:var(--red);display:none">密码错误，请重试</div>
  </div>
</div>

<script>
'use strict';
/* ================= 状态 ================= */
let cfg = null;              // 完整 config 副本（从 /admin/api/config 读）
let stats = null;
let token = localStorage.getItem('akp_admin_token') || '';
let role = 'admin';          // 'admin' | 'collab'
let dirty = false;
let currentTab = 'home';
let accessRows = [];         // 分发 Key 编辑中间层：[{key,name,rpm,daily}]
let statsTimer = null;
let logsFilter = { days: 2, limit: 100, caller: '', model: '', status: '', errorType: '' };
let usageFilter = { days: 7, caller: '' };
let usageView = 'daily';     // 'daily' | 'hourly'

const $main = document.getElementById('main');
const $nav = document.getElementById('nav');
const $toast = document.getElementById('toast');

/* ================= 工具 ================= */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getByPath(o, p){ return p.split('.').reduce((x,k)=> x==null?undefined:x[k], o); }
function setByPath(o, p, v){
  const ks = p.split('.'); let x = o;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(x[k]==null) x[k] = /^\d+$/.test(ks[i+1])?[]:{}; x = x[k]; }
  x[ks[ks.length-1]] = v;
}
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind||'');
  t.textContent = msg;
  $toast.appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=> t.remove(), 300); }, 2600);
}
function markDirty(){ dirty = true; document.getElementById('dirty-dot').classList.add('show'); }

/* ================= API ================= */
async function api(method, path, body){
  const headers = {};
  if (token) headers['authorization'] = 'Bearer ' + token;
  if (body !== undefined) headers['content-type'] = 'application/json';
  const resp = await fetch(path, { method, headers, body: body===undefined?undefined:JSON.stringify(body) });
  let data = null;
  try { data = await resp.json(); } catch(_) {}
  if (resp.status === 401 && data && data.needAuth){ promptPassword(); throw new Error('NEED_AUTH'); }
  return { status: resp.status, ok: resp.ok, data };
}

async function loadConfig(){
  const r = await api('GET', '/admin/api/config');
  if (r.status === 200){
    cfg = r.data.config;
    initAccessRows();
    document.getElementById('hdr-addr').textContent = (r.data.runtime.host || '127.0.0.1') + ':' + (r.data.runtime.port || 8787);
    render();
  }
}

async function loadStats(){
  try {
    const headers = {};
    if (token) headers['authorization'] = 'Bearer ' + token; // adminToken 设置后 /stats 需鉴权
    const resp = await fetch('/stats', { headers });
    if (!resp.ok) return;
    stats = await resp.json();
    if (currentTab === 'home') renderHome();
    else if (currentTab === 'overview') renderOverview();
  } catch(_) {}
}

async function save(){
  if (!cfg) return;
  syncAccessToCfg();
  const oldToken = cfg.adminToken;
  const r = await api('PUT', '/admin/api/config', cfg);
  if (r.status === 200){
    dirty = false; document.getElementById('dirty-dot').classList.remove('show');
    // adminToken 变更后，把新值写入本地，避免下次被锁在门外
    if (cfg.adminToken) token = localStorage['akp_admin_token'] = cfg.adminToken;
    else if (oldToken) { token = localStorage['akp_admin_token'] = ''; }
    toast('已保存并热重载生效', 'ok');
    if (r.data.warnings && r.data.warnings.length) toast(r.data.warnings.join('；'), 'err');
    await loadConfig();
    loadStats();
  } else {
    toast((r.data && r.data.error && r.data.error.message) || '保存失败', 'err');
  }
}

/* ================= 渲染 ================= */
function render(){
  const tab = currentTab;
  if (tab === 'home') renderHome();
  else if (tab === 'overview') renderOverview();
  else if (tab === 'providers') renderProviders();
  else if (tab === 'models') renderModels();
  else if (tab === 'access') renderAccess();
  else if (tab === 'logs') renderLogs();
  else if (tab === 'usage') renderUsage();
  else if (tab === 'settings') renderSettings();
  else if (tab === 'playground') renderPlayground();
}

function stateColor(s){ return s==='ready'?var_green():s==='busy'?var_blue():s==='cooling'?var_orange():s==='verify'?'#8b5cf6':var_red(); }
function var_green(){return '#10b981'} function var_blue(){return '#3b82f6'} function var_orange(){return '#f59e0b'} function var_red(){return '#ef4444'} function var_purple(){return '#8b5cf6'}
function stateLabel(k){ return k.state==='ready'?'可用':k.state==='busy'?'忙碌':k.state==='cooling'?('冷却 '+Math.ceil(k.cooldownRemainMs/1000)+'s'+(k.groupCooldownRemainMs>k.cooldownRemainMs?`(组${Math.ceil(k.groupCooldownRemainMs/1000)}s)`:'')).toString():k.state==='verify'?'待探活':'已下线'; }
function stateBadge(k){
  const s = k.state;
  if (s==='ready') return '<span class="badge badge-ok"><span class="dot"></span>可用</span>';
  if (s==='busy') return '<span class="badge badge-blue"><span class="dot"></span>忙碌</span>';
  if (s==='cooling') return `<span class="badge badge-warn"><span class="dot"></span>冷却 ${Math.ceil(k.cooldownRemainMs/1000)}s</span>`;
  if (s==='verify') return '<span class="badge badge-purple"><span class="dot"></span>待探活</span>';
  return '<span class="badge badge-err"><span class="dot"></span>已下线</span>';
}

function genKey(){
  return 'sk-pool-' + (crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):Math.random().toString(36).slice(2)+Date.now().toString(36)).slice(0,32);
}

function syncAccessToCfg(){
  const ak = {};
  for (const r of accessRows){
    if (!r.key) continue;
    const parts = {};
    if (r.name) parts.name = r.name;
    if (r.rpm > 0) parts.rpm = r.rpm;
    if (r.daily > 0) parts.daily = r.daily;
    if (r.enabled === false) parts.enabled = false;
    const keys = Object.keys(parts);
    if (keys.length === 0) ak[r.key] = '未命名';
    else if (keys.length === 1 && parts.name) ak[r.key] = parts.name;
    else ak[r.key] = parts;
  }
  cfg.accessKeys = ak;
}

function collectCallerNames(){
  const set = new Set();
  const ak = cfg.accessKeys||{};
  for (const k of Object.keys(ak)){
    if (k.startsWith('_')||k.startsWith('#')) continue;
    const spec = ak[k];
    const name = typeof spec === 'string' ? spec : (spec && spec.name) || '';
    if (name) set.add(name);
  }
  return [...set].sort();
}

function fillLogsTable(data){
  const tb = document.getElementById('logs-tbody');
  if (!tb) return;
  const entries = data.entries || [];
  const rows = entries.map(e=>{
    const time = e.ts ? new Date(e.ts).toLocaleString('zh-CN',{hour12:false}) : '-';

      <td class="mono" style="white-space:nowrap;font-size:12px">${esc(time)}</td>

      <td><code>${esc(e.model||'—')}</code></td>

      <td>${e.tokens?e.tokens.total??'-':'—'}</td>

    </tr>`;
  }).join('');
  tb.innerHTML = rows || '<tr><td colspan="8" class="faint">暂无调用日志</td></tr>';
  const cnt = document.getElementById('log-count');
  if (cnt) cnt.textContent = `共 ${data.total} 条${data.truncated?'（仅显示前 '+entries.length+' 条）':''}`;
}

function chartSVG(items){
  if (!items || !items.length) return '<div class="empty">暂无数据</div>';
  const W = 680, H = 220, padL = 46, padB = 30, padT = 20, padR = 16;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxCalls = Math.max(1, ...items.map(d => (d.ok||0)+(d.fail||0)));
  const n = items.length, step = chartW / n;
  const barW = Math.max(3, Math.min(36, step * 0.62));
  const y = v => padT + chartH - (v / maxCalls) * chartH;
  let grid = '';
  for (let g = 0; g <= 4; g++){
    const v = maxCalls * g / 4, yy = y(v);
    grid += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#eef0f2"/>`
      + `<text x="${padL-6}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#6b7280">${Math.round(v)}</text>`;
  }
  let bars = '', labels = '';
  items.forEach((d, i)=>{
    const cx = padL + step*i + step/2, x = cx - barW/2;
    const okH = (d.ok||0)/maxCalls*chartH, failH = (d.fail||0)/maxCalls*chartH;
    const okY = padT + chartH - okH - failH, failY = padT + chartH - failH;
    bars += `<rect x="${x.toFixed(1)}" y="${failY.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,failH).toFixed(1)}" fill="#ef4444"/>`;
    bars += `<rect x="${x.toFixed(1)}" y="${okY.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,okH).toFixed(1)}" fill="#10b981"/>`;
    if ((d.total||0) > 0) bars += `<text x="${cx.toFixed(1)}" y="${(Math.min(okY,failY)-4).toFixed(1)}" text-anchor="middle" font-size="9" fill="#6b7280">${d.total}</text>`;
    labels += `<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#6b7280">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:100%;display:block">${grid}${bars}${labels}</svg>`;
}

function firstAccessKey(){
  const ak = cfg.accessKeys||{};
  for (const k of Object.keys(ak)){ if(k.startsWith('_')||k.startsWith('#'))continue; return k; }
  return '';
}

async function runTest(){
  const model = document.getElementById('pg-model').value.trim() || 'auto';
  const content = document.getElementById('pg-msg').value;
  const maxTokens = Number(document.getElementById('pg-maxt').value) || 256;
  const stream = document.getElementById('pg-stream').checked;
  const out = document.getElementById('pg-out');
  const headers = {'content-type':'application/json'};
  const k = firstAccessKey();
  if (k) headers['authorization'] = 'Bearer ' + k;
  else if (cfg.proxyApiKey) headers['authorization'] = 'Bearer ' + cfg.proxyApiKey;
  const body = { model, messages:[{role:'user',content}], max_tokens:maxTokens };
  if (stream) body.stream = true;
  const t0 = Date.now();
  out.innerHTML = '<div class="hint">请求中…</div>';
  try {
    if (stream){
      const resp = await fetch('/v1/chat/completions', {method:'POST',headers,body:JSON.stringify(body)});
      if (!resp.ok){ out.innerHTML = `<div class="box"><pre>HTTP ${resp.status}\n${esc(await resp.text())}</pre></div>`; return; }
      const reader = resp.body.getReader();
      const dec = new TextDecoder(); let full='', reasoning='', buf='';
      while(true){
        const {done,value} = await reader.read(); if(done)break;
        buf += dec.decode(value,{stream:true});
        const lines = buf.split('\n'); buf = lines.pop();
        for(const line of lines){
          const l = line.trim(); if(!l.startsWith('data:'))continue;
          const d = l.slice(5).trim(); if(d==='[DONE]')continue;
          try{ const j=JSON.parse(d); const dt=j.choices?.[0]?.delta||{};
            if(dt.content)full+=dt.content; if(dt.reasoning_content)reasoning+=dt.reasoning_content; }catch(_){}
        }
      }
      out.innerHTML = resultBox({content:full, reasoning, ms:Date.now()-t0, model, stream:true});
    } else {
      const resp = await fetch('/v1/chat/completions', {method:'POST',headers,body:JSON.stringify(body)});
      const j = await resp.json();
      if (!resp.ok || j.error){ out.innerHTML = `<div class="box"><pre>HTTP ${resp.status}\n${esc(JSON.stringify(j.error||j,null,2))}</pre></div>`; return; }
      const m = j.choices?.[0]?.message||{};
      out.innerHTML = resultBox({content:m.content||'', reasoning:m.reasoning_content||'', usage:j.usage, ms:Date.now()-t0, model});
    }
  } catch(e){ out.innerHTML = `<div class="box"><pre>请求异常：${esc(e.message)}</pre></div>`; }
}

function resultBox(r){
  const reasoning = r.reasoning ? `<div class="reasoning"><b>思考过程（reasoning_content）</b><pre>${esc(r.reasoning)}</pre></div>` : '';
  const usage = r.usage ? `<div class="meta">tokens: ${r.usage.prompt_tokens}+${r.usage.completion_tokens}=${r.usage.total_tokens||'-'}</div>` : '';
  return `<div class="box"><div class="meta">model: ${esc(r.model)} · 耗时 ${r.ms}ms${r.stream?'（流式）':''}</div>
    <pre>${esc(r.content||'(内容为空)')}</pre>${reasoning}${usage}</div>`;
}

/* ================= 事件 ================= */
$nav.addEventListener('click', e=>{
  const b = e.target.closest('[data-tab]'); if(!b) return;
  switchTab(b.dataset.tab);
});
const TAB_TITLES = { home:'首页', overview:'运行状态', providers:'密钥管理', models:'模型', access:'对接密钥', logs:'使用记录', usage:'用量统计', settings:'设置', playground:'试一下' };
function switchTab(tab){
  currentTab = tab;
  [...$nav.children].forEach(x=>x.classList.toggle('active', x.dataset.tab===tab));
  const pt = document.getElementById('page-title'); if (pt) pt.textContent = TAB_TITLES[tab] || '管理台';
  render();
  if (tab==='home' || tab==='overview') loadStats();
  else if (tab==='logs') loadLogs();
  else if (tab==='usage') loadUsage();
}

$main.addEventListener('input', e=>{
  const el = e.target;
  if (el.dataset.set != null){
    let v = el.value;
    if (el.type==='checkbox') v = el.checked;
    else if (el.type==='number') v = v===''?0:Number(v);
    if (el.dataset.set.endsWith('extraHeadersJson')){
      const base = el.dataset.set.replace(/extraHeadersJson$/,'extraHeaders');
      try { setByPath(cfg, base, v.trim()?JSON.parse(v):undefined); } catch(_) { /* 非法 JSON 忽略，等保存时报错 */ }
    } else {
      setByPath(cfg, el.dataset.set, v);
    }
    markDirty(); return;
  }
  if (el.dataset.keys != null){
    const p = getByPath(cfg, el.dataset.keys);
    if (p) { p.keys = el.value.split('\n').map(s=>s.trim()).filter(Boolean); markDirty(); }
    return;
  }
  if (el.dataset.access != null){
    const [idx, field] = el.dataset.access.split('.');
    if (!accessRows[idx]) accessRows[idx] = {key:'',name:'',rpm:0,daily:0,enabled:true};
    let v = el.value;
    if (el.type==='checkbox') v = el.checked;
    else if (el.type==='number') v = v===''?0:Number(v);
    accessRows[idx][field] = v; markDirty(); return;
  }
  if (el.dataset.aliasName != null){
    const old = el.dataset.aliasName, nv = el.value.trim();
    if (nv && nv !== old && !nv.includes('.') && cfg.models[old] !== undefined){
      cfg.models[nv] = cfg.models[old]; delete cfg.models[old]; el.dataset.aliasName = nv;
    }
    markDirty(); return;
  }
});

$main.addEventListener('click', e=>{
  const goto = e.target.closest('[data-goto]'); if(goto){ switchTab(goto.dataset.goto); return; }
  const btn = e.target.closest('[data-action]'); if(!btn) return;
  const act = btn.dataset.action;
  const idx = Number(btn.dataset.idx);
  if (act === 'addProvider'){
    cfg.providers = cfg.providers || [];
    cfg.providers.push({name:'', baseUrl:'', chatPath:'', rpmPerKey:0, rpmPerAccount:0, maxConcurrencyPerKey:0, keys:[]});
    renderProviders(); markDirty();
  } else if (act === 'delProvider'){
    cfg.providers.splice(idx,1); renderProviders(); markDirty();
  } else if (act === 'addModel'){
    let n = 'new'; let i = 2; while (cfg.models && cfg.models[n]) n = 'new' + (i++);
    cfg.models = cfg.models || {}; cfg.models[n] = [{provider:(cfg.providers[0]||{}).name||'', model:''}];
    renderModels(); markDirty();
  } else if (act === 'delModel'){
    delete cfg.models[btn.dataset.alias]; renderModels(); markDirty();
  } else if (act === 'addModelCandidate'){
    const a = btn.dataset.alias; const arr = cfg.models[a] = (Array.isArray(cfg.models[a])?cfg.models[a]:[cfg.models[a]]);
    arr.push({provider:(cfg.providers[0]||{}).name||'', model:''}); renderModels(); markDirty();
  } else if (act === 'delModelCandidate'){
    const a = btn.dataset.alias; const arr = cfg.models[a]; arr.splice(idx,1); if(!arr.length) delete cfg.models[a];
    renderModels(); markDirty();
  } else if (act === 'addAccess'){
    accessRows.push({key:'', name:'', rpm:0, daily:0, enabled:true}); renderAccess(); markDirty();
  } else if (act === 'genAccess'){
    accessRows.push({key:genKey(), name:'新用户', rpm:10, daily:300, enabled:true}); renderAccess(); markDirty();
  } else if (act === 'genAccessBatch'){
    for (let n = 0; n < 5; n++) accessRows.push({key:genKey(), name:'新用户'+(accessRows.length+1), rpm:10, daily:300, enabled:true});
    renderAccess(); markDirty(); toast('已生成 5 个随机 Key，记得保存', 'ok');
  } else if (act === 'delAccess'){
    accessRows.splice(idx,1); renderAccess(); markDirty();
  }
});

document.getElementById('btn-save').addEventListener('click', save);
document.getElementById('btn-reload').addEventListener('click', ()=>{ dirty=false; document.getElementById('dirty-dot').classList.remove('show'); loadConfig(); loadStats(); toast('已重新加载'); });
document.getElementById('btn-lock').addEventListener('click', ()=>{ token = localStorage['akp_admin_token'] = ''; promptPassword(); });

/* ================= 密码弹窗 ================= */
function promptPassword(){
  document.getElementById('modal-err').style.display='none';
  document.getElementById('modal-pwd').value='';
  document.getElementById('modal').classList.add('show');
  document.getElementById('modal-pwd').focus();
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal-ok').addEventListener('click', async ()=>{
  const pwd = document.getElementById('modal-pwd').value.trim();
  if (!pwd) return;
  token = pwd;
  const r = await fetch('/admin/api/config', { headers:{ authorization:'Bearer '+pwd } });
  if (r.status === 200){
    role = 'admin';
    localStorage['akp_admin_token'] = pwd;
    closeModal();
    await loadConfig(); loadStats();
  } else {
    // 不是 adminToken —— 试协同管理员身份
    const cr = await fetch('/admin/api/collab/whoami', { headers:{ authorization:'Bearer '+pwd } });
    if (cr.status === 200){
      role = 'collab';
      localStorage['akp_admin_token'] = pwd;
      try { collabProviders = (await cr.json()).providers || []; } catch(_) {}
      closeModal();
      applyRoleUI();
      toast('已登录（协同管理员）', 'ok');
    } else {
      token = '';
      document.getElementById('modal-err').style.display='block';
    }
  }
});

/* 协同管理员：精简界面（只保留 放上游Key / 生成用户Key / 我创建的Key 三个功能） */
function applyRoleUI(){
  if (role !== 'collab') return;
  document.querySelectorAll('#nav [data-tab]').forEach(b=>{
    const t = b.dataset.tab;
    if (t !== 'collab-keys' && t !== 'collab-access' && t !== 'collab-list') b.style.display = 'none';
  });
  // 顶栏保存/刷新按钮对协同管理员隐藏（他们的操作即时生效，无草稿态）
  document.getElementById('btn-save').style.display = 'none';
  const rl = document.getElementById('btn-reload'); if (rl) rl.style.display = 'none';
  currentTab = 'collab-keys';
  document.querySelectorAll('#nav [data-tab]').forEach(b=>b.classList.toggle('active', b.dataset.tab==='collab-keys'));
  renderCollab();
}
function genPoolKey(){ const c='abcdefghijklmnopqrstuvwxyz0123456789'; let s=''; for(let i=0;i<32;i++) s+=c[Math.floor(Math.random()*c.length)]; return 'sk-pool-'+s; }

let collabProviders = [];   // [{name, keyCount}]
let collabLastCreated = [];

async function collabApi(method, path, body){
  const resp = await fetch(path, { method, headers:{ 'content-type':'application/json', authorization:'Bearer '+token }, body: body?JSON.stringify(body):undefined });
  const data = await resp.json().catch(()=>({}));
  if (resp.status === 401 && data.needAuth){ promptPassword(); throw new Error('NEED_AUTH'); }
  if (!resp.ok) throw new Error(data.error && data.error.message || ('HTTP '+resp.status));
  return data;
}

async function renderCollab(){
  const main = document.getElementById('main');
  if (currentTab === 'collab-keys'){
    let opts = collabProviders.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}（${p.keyCount} keys）</option>`).join('');
    main.innerHTML = `
    <div class="box" style="max-width:640px">
      <h3>上传上游 Key</h3>
      <div class="sub">把新的平台 Key 追加到池子里。自动跳过重复 Key。</div>
      <div class="field"><label>平台</label><select class="f" id="ck-provider">${opts}</select></div>
      <div class="field"><label>Key 列表（一行一个，可带 @账号标签）</label>
        <textarea class="f mono" id="ck-keys" rows="6" placeholder="sk-xxxx&#10;sk-yyyy@账号2"></textarea></div>
      <button class="btn primary" id="ck-submit">追加到池子</button>
      <div class="hint" id="ck-result" style="margin-top:10px"></div>
    </div>`;
    document.getElementById('ck-submit').addEventListener('click', async ()=>{
      const provider = document.getElementById('ck-provider').value;
      const keys = document.getElementById('ck-keys').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      if (!keys.length) return toast('请先粘贴 Key', 'err');
      try {
        const r = await collabApi('POST', '/admin/api/collab/keys', { provider, keys });
        document.getElementById('ck-result').textContent = `已追加 ${r.added} 个，跳过重复 ${r.skipped} 个，该平台现有 ${r.providerKeys} 个 Key`;
        document.getElementById('ck-keys').value = '';
        toast('上游 Key 已入池', 'ok');
      } catch(e){ toast('失败：'+e.message, 'err'); }
    });
  } else if (currentTab === 'collab-access'){
    main.innerHTML = `
    <div class="box" style="max-width:640px">
      <h3>生成用户 Key</h3>
      <div class="sub">创建分发给使用者的调用密钥，即时生效。</div>
      <div class="field"><label>用户名</label><input class="f" id="ca-name" value="用户" placeholder="显示在用量统计里"></div>
      <div class="row" style="gap:12px">
        <div class="field" style="flex:1"><label>每分钟上限</label><input class="f" id="ca-rpm" type="number" value="10"></div>
        <div class="field" style="flex:1"><label>每天上限</label><input class="f" id="ca-daily" type="number" value="300"></div>
        <div class="field" style="flex:1"><label>生成数量</label><input class="f" id="ca-count" type="number" value="1" min="1" max="20"></div>
      </div>
      <button class="btn primary" id="ca-submit">生成</button>
      <div id="ca-result" style="margin-top:14px"></div>
    </div>`;
    document.getElementById('ca-submit').addEventListener('click', async ()=>{
      const body = {
        name: document.getElementById('ca-name').value.trim() || '用户',
        rpm: parseInt(document.getElementById('ca-rpm').value,10) || 10,
        daily: parseInt(document.getElementById('ca-daily').value,10) || 300,
        count: parseInt(document.getElementById('ca-count').value,10) || 1,
      };
      try {
        const r = await collabApi('POST', '/admin/api/collab/accessKeys', body);
        collabLastCreated = r.created;
        document.getElementById('ca-result').innerHTML = r.created.map(c=>
          `<div class="box" style="margin-bottom:8px"><div class="mono" style="user-select:all;word-break:break-all">${esc(c.key)}</div><div class="hint">${esc(c.name)} · ${c.rpm} RPM/日 ${c.daily} 次</div></div>`).join('');
        toast(`已生成 ${r.created.length} 个 Key`, 'ok');
      } catch(e){ toast('失败：'+e.message, 'err'); }
    });
  } else if (currentTab === 'collab-list'){
    main.innerHTML = `<div class="box"><h3>我创建的分发 Key</h3><div class="sub">含每个 Key 的实时用量。重新点页签即刷新。</div><div id="cl-body"><div class="faint">加载中…</div></div></div>`;
    (async ()=>{
      const body = document.getElementById('cl-body');
      try {
        const r = await collabApi('GET', '/admin/api/collab/listAccessKeys');
        if (!r.keys.length){ body.innerHTML = '<div class="faint">还没有创建过。去「生成用户Key」创建。</div>'; return; }
        body.innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>Key</th><th>用户名</th><th>限额</th><th>今日</th><th>累计</th><th>状态</th></tr></thead><tbody>'
          + r.keys.map(k=>`<tr>
            <td class="mono" style="user-select:all;word-break:break-all">${esc(k.key)}</td>
            <td>${esc(k.name)}</td>
            <td>${k.rpm||'∞'} RPM / 日 ${k.daily||'∞'}</td>
            <td><b>${k.today||0}</b></td>
            <td>${k.total||0}</td>
            <td>${k.stillExists===false?'<span style="color:var(--red)">已删除</span>':'<span style="color:var(--ok)">有效</span>'}</td>
          </tr>`).join('') + '</tbody></table></div>';
      } catch(e){ body.innerHTML = '<div class="faint">加载失败：'+esc(e.message)+'</div>'; }
    })();
  }
}
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-pwd').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('modal-ok').click(); });

/* tab 切换：协同管理员页签走独立渲染 */
document.getElementById('nav').addEventListener('click', (e)=>{
  const b = e.target.closest('[data-tab]'); if(!b) return;
  const t = b.dataset.tab;
  if (t === 'collab-keys' || t === 'collab-access' || t === 'collab-list'){ currentTab = t; renderCollab(); }
});

/* ================= 启动 ================= */
(async function init(){
  try { await loadConfig(); } catch(e){ if (e.message !== 'NEED_AUTH') toast('加载配置失败：' + e.message, 'err'); }
  loadStats();
  statsTimer = setInterval(loadStats, 5000);
  window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
})();
</script>
